[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rew-to-autoeq"
version = "0.1.0"
description = "Convert REW (Room EQ Wizard) measurement exports into AutoEQ CSV format"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "xup61069" },
]
keywords = ["rew", "autoeq", "equalizer", "headphones", "audio", "frequency-response"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

[project.scripts]
rew2autoeq = "rew_to_autoeq.cli:main"

[tool.setuptools.packages.find]
include = ["rew_to_autoeq*"]

